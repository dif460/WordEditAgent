services:
  db:
    image: postgres:17-alpine
    container_name: wordeditagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wordagent
      POSTGRES_PASSWORD: wordagent
      POSTGRES_DB: wordedit
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordagent -d wordedit"]
      interval: 5s
      timeout: 5s
      retries: 10
